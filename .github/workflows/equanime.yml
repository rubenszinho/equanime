name: Equânime

on:
  pull_request:
  push:
    paths:
      - "equanime-api/**"
      - "equanime-agent/**"
      - "equanime-collector/**"
      - "equanime-web-client/**"
      - "fixtures/**"
      - ".github/workflows/equanime.yml"

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: equanime-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: equanime-api/package-lock.json
      - run: npm ci
      - name: Generated binding types match wrangler.jsonc
        run: npm run cf-typegen && git diff --exit-code worker-configuration.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --dry-run

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: equanime-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: equanime-agent/package-lock.json
      - run: npm ci
      - name: Generated binding types match wrangler.jsonc
        run: npx wrangler types && git diff --exit-code worker-configuration.d.ts
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx wrangler deploy --dry-run --minify

  collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: equanime-collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: equanime-web-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: equanime-web-client/package-lock.json
      - run: npm ci
      - name: Generated binding types match wrangler.jsonc
        run: npx wrangler types && git diff --exit-code worker-configuration.d.ts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run check
      - run: npm run build
      - run: npx wrangler deploy --dry-run
