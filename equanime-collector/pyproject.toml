[project]
name = "equanime-collector"
version = "0.2.0"
description = "Private Lattes collection adapter for Equânime"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32", "beautifulsoup4>=4.12", "lxml>=5", "playwright>=1.49"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
markers = ["live_lattes: collects a real Lattes profile (run with -m live_lattes)"]
addopts = "-m 'not live_lattes'"
testpaths = ["tests"]
pythonpath = ["src"]
